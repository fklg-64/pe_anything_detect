# 処理画像サイズ
image_size: 512

# モデルに入力する画像サイズの決め方
#   square: アスペクト比を無視して image_size x image_size にリサイズする（従来どおり）
#   fit   : アスペクト比を保ち、長辺を image_size に合わせる（短辺は同じ倍率に近いパッチサイズ(16)の倍数）。image_size x image_size に収まる
#   pad   : fit と同じ大きさにリサイズし、短辺側の下／右を端の画素の複製で image_size x image_size まで埋める。特徴量の抽出後、パディング部分は無視する
resize_mode: "square"

# Kmeansのクラスタ数
k_clusters: 8

# Kmeansのループ回数（多いほどクラスタは整う）
n_iter: 10

# モデルのディレクトリ
model_dir: "./weights/openvino_models"

# プロンプトが保存されているディレクトリ
prompts_dir: "./prompts"

# OpenVINOの処理に使用するスレッド数
ov_num_thread: 4

# モデルを入力の大きさを固定した（静的形状の）モデルとして読み込むか？（変換し直す必要は無く、読み込み時に reshape する）
#   false: 動的形状のまま（従来どおり）
#   true : PE・EdgeTAMエンコーダー・デコーダーを image_size 四方に固定してコンパイルする。PE が約 16ms、デコーダーが1回約 2ms 速くなる
#          代わりに、出力が動的形状と bit 単位では一致しない（数値が微小に変わる）。resize_mode: fit では使えない（入力の大きさが画像ごとに変わる）。
#          形が違う入力（格子分離のセルごとのデコード、pad のパディングを除いた特徴量）は、動的形状のモデルで推論する（初めて必要になったときにコンパイルする）
ov_static_shape: true

# 静的形状のモデルのグラフを書き換えて速くするか？（ov_static_shape が true のときだけ。core/openvino/graph_edits.py）
#   true : デコーダーの Reorder（NCHW <-> NHWC のレイアウト変換）を除く。デコード 1 回が約 16 → 9ms。出力は書き換え前と同じ（bit 一致）
#   false: 書き換えない（変換したままのグラフ。実験で比べるとき）
ov_optimize_graph: true

# 使用するデバイス
device: "cpu"

# INT8で量子化されたモデルを使用するか？
et_use_int8: false
pe_use_int8: false

# EdgeTAMに入力するポイント数
# 前景：粗いセマンティックセグメンテーションのクラスごとに抽出する数
edgetam_foreground_points_per_class: 4
# 背景：粗い前景・背景マスクで背景と判定された領域から抽出する数
edgetam_background_point_count: 4

# 粗い判定の前景確信度を、EdgeTAMの特徴（image_embed）が似たパッチどうしで伝播して揃える（kNNグラフ。α=0.8、k=8、3回）。
# 背景の斑点・織り目などの誤検出（小物体・複数物体・雑多な背景の画像）を、前景を消さずに減らす。プロンプトの数に依らない。
# EdgeTAMエンコーダは粗い判定の前に1回だけ実行し、精緻化にも使う
use_edgetam_clustering: true

# EdgeTAMでマスクを反復精緻化する回数（前回のロジットを入力に再推定）
edgetam_refine_iterations: 2

# モデルの推論と重ねて NumPy / OpenCV の整形を実行する Python のスレッド数（0 なら重ねず、順に実行する）
#   領域（クラス・取りこぼしの成分）ごとのマスクの整形を次のデコードと、EdgeTAM の特徴の kNN グラフを PE の推論と重ねる。cable のように領域が多い画像で効く
#   （cable/000 で約 -30ms）。結果は従来と同じ順に反映するので、出力は変わらない。OpenVINO のスレッド数（ov_num_thread）は変わらない。2 で十分（3 以上は変わらない）
worker_threads: 2

# セマンティックマップのマスク演算（重なり解決・ノイズ除去）を行う作業解像度の長辺上限（出力は元画像サイズ）
semantic_max_side: 1024

# 元画像に重畳するセマンティックカラーの不透明度
overlay_alpha: 0.5

# セマンティックセグメンテーション結果をmatplotlibのウィンドウで表示するか？（Falseでもpngは保存）
show_result: false

# output_dir直下に結果の一覧HTML（index.html。元画像と各結果画像・処理時間）を出力するか？
save_gallery_html: true

# 前景と判断するための自信度合い
foreground_threshold: 0.5

# 結果を出力するディレクトリ
output_dir: "./outputs/experiment_results_20261031_2"

