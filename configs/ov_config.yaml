# 処理画像サイズ
image_size: 512

# Kmeansのクラスタ数
k_clusters: [8]

# Kmeansのループ回数（多いほどクラスタは整う）
n_iter: 10

# プロンプト数（初回）
init_n_points: 5

# リファイン繰り返し数
max_refine_steps: 0

# モデルのディレクトリ
model_dir: "./weights/openvino_models"

# プロンプトが保存されているディレクトリ
prompts_dir: "./prompts"

# OpenVINOの処理に使用するスレッド数
ov_num_thread: 4

# 使用するデバイス
device: "cpu"

# INT8で量子化されたモデルを使用するか？
use_int8: false

# 前景と判断するための自信度合い
foreground_threshold: 0.5

# 結果を出力するディレクトリ
output_dir: "./outputs/experiment_results"

