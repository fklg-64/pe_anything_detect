# 処理画像サイズ（アスペクト比を無視して image_size 四方にリサイズする。PE のパッチサイズ 16 と EdgeTAM の 32 の倍数であること）
image_size: 512

# Kmeansのクラスタ数
k_clusters: 8

# Kmeansのループ回数（多いほどクラスタは整う）
n_iter: 10

# モデルのディレクトリ
model_dir: "./weights/openvino_models"

# プロンプトが保存されているディレクトリ
prompts_dir: "./prompts"

# OpenVINOの処理に使用するスレッド数
ov_num_thread: 4

# モデルを入力の大きさを固定した（静的形状の）モデルとして読み込むか？（変換し直す必要は無く、読み込み時に reshape する）
#   false: 動的形状のまま（従来どおり）
#   true : PE・EdgeTAMエンコーダー・デコーダーを image_size 四方に固定してコンパイルする。PE が約 16ms、デコーダーが1回約 2ms 速くなる
#          代わりに、出力が動的形状と bit 単位では一致しない（数値が微小に変わる）。
#          形が違う入力（格子分離のセルごとのデコード）は、動的形状のモデルで推論する（初めて必要になったときにコンパイルする）
#          true のときは、EdgeTAM のグラフも書き換えて速くする（デコーダーの Reorder を除く。デコード 1 回が約 16 → 9ms。出力は書き換え前と同じ。core/openvino/graph_edits.py）
ov_static_shape: true

# 使用するデバイス
device: "cpu"

# INT8で量子化されたモデルを使用するか？
et_use_int8: false
pe_use_int8: false

# EdgeTAMに入力するポイント数
# 前景：粗いセマンティックセグメンテーションのクラスごとに抽出する数
edgetam_foreground_points_per_class: 4
# 背景：粗い前景・背景マスクで背景と判定された領域から抽出する数
edgetam_background_point_count: 4

# EdgeTAMでマスクを反復精緻化する回数（前回のロジットを入力に再推定）
edgetam_refine_iterations: 2

# モデルの推論と重ねて NumPy / OpenCV の整形を実行する Python のスレッド数（0 なら重ねず、順に実行する）
#   領域（クラス・取りこぼしの成分）ごとのマスクの整形を次のデコードと、EdgeTAM の特徴の kNN グラフを PE の推論と重ねる。cable のように領域が多い画像で効く
#   （cable/000 で約 -30ms）。結果は従来と同じ順に反映するので、出力は変わらない。OpenVINO のスレッド数（ov_num_thread）は変わらない。2 で十分（3 以上は変わらない）
worker_threads: 2

# セマンティックマップのマスク演算（重なり解決・ノイズ除去）を行う作業解像度の長辺上限（出力は元画像サイズ）
semantic_max_side: 1024

# 元画像に重畳するセマンティックカラーの不透明度
overlay_alpha: 0.5

# セマンティックセグメンテーション結果をmatplotlibのウィンドウで表示するか？（Falseでもpngは保存）
show_result: false

# output_dir直下に結果の一覧HTML（index.html。元画像と各結果画像・処理時間）を出力するか？
save_gallery_html: true

# 同じクラスの接触した物体を 1 個ずつに分ける（インスタンス分離。docs/instance_segmentation.md。結果は SegmentationResult.instance_map）。
# EdgeTAMのデコーダーを物体の数だけ追加で実行するので、既定は無効。重なった物体は分けられない
instance_split: false
# 分け方: proposals（点ごとに提案を作って選別。接触した同種の物体で最も安定）/ merge（過分割 → デコーダーの一貫性とくびれで結合。離れた物体を過分割しにくい）
instance_method: "proposals"

# 向き・大きさが混在して接した長方形の物体（積んだ荷物・並べた部品）を 1 個ずつのインスタンスに分けるか？（学習なし。result.instances に入る）
#   false: 分けない（従来どおり）
#   true : 最終結果の前景に対して、大きさ（長辺・短辺）を画像から求め、その大きさの長方形を敷き詰めて EdgeTAM で 1 個ずつ切り出す。追加で 約 0.3 秒（OpenVINO 版）。
#          長い直線の縁を持つ細長い長方形の密集向き（散らばった小さい部品には当たらない）。image_size は 512 のとき（core/common/rect_separator.py）
dense_instances: false

# 前景と判断するための自信度合い
foreground_threshold: 0.5

# 結果を出力するディレクトリ
output_dir: "./outputs/experiment_results_20261104"
